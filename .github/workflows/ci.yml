name: Sprint 1 CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run available lint scripts
        run: npm run lint --if-present
      - name: Run server unit and integration tests
        run: npm run test:server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/online_bookstore_ci
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      - name: Run client unit tests
        run: npm run test:client
      - name: Build client
        run: npm run build
